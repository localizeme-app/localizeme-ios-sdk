name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on macOS
        run: swift test
      # Xcode compiles the string plugin with its Xcode-project half too,
      # which `swift test` leaves out, and runs it on the tests' own tables.
      - name: Build the tests and the string plugin with Xcode
        run: xcodebuild build-for-testing -scheme LocalizeMe-Package -destination "platform=macOS" -skipPackagePluginValidation -quiet
      # The package is compiled for every platform Package.swift promises.
      - name: Build for iOS
        run: xcodebuild build -scheme LocalizeMe -destination "generic/platform=iOS" -quiet
      - name: Build for the iOS Simulator
        run: xcodebuild build -scheme LocalizeMe -destination "generic/platform=iOS Simulator" -quiet
      - name: Build for tvOS
        run: xcodebuild build -scheme LocalizeMe -destination "generic/platform=tvOS" -quiet
      - name: Build for watchOS
        run: xcodebuild build -scheme LocalizeMe -destination "generic/platform=watchOS" -quiet
